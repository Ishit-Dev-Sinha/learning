<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatBot</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin-top: 0px;
        margin-bottom: 0px;
      }
      .send-button {
        background-color: green;
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        font-size: 15px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      input {
        padding: 12px 50px 12px 12px;
        border-radius: 10px;
        font-size: 15px;
        flex-grow: 1;
      }
      .message-box {
        background-color: gainsboro;
        border-radius: 10px;
        height: 10 em;
        padding: 15px 20px;
        margin-left: 10px;
        margin-right: 10px;
        max-width: 300px;
      }
      .chat-input {
        display: flex;
        margin-bottom: 15px;
        margin-top: 15px;
      }
      .app-container {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .messages-container {
        flex-grow: 1;
        overflow: scroll;
        scrollbar-width: none;
      }
      .user-chat {
        display: flex;
        justify-content: end;
        margin-top: 15px;
        margin-bottom: 15px;
        align-items: start;
      }
      .robot-chat {
        display: flex;
        justify-content: start;
        margin-top: 15px;
        margin-bottom: 15px;
        align-items: start;
      }
    </style>
  </head>

  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script type="text/babel">
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState("");

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function sendMessage() {
          const response = Chatbot.getResponse(inputText);

          setChatMessages([
            ...chatMessages,
            {
              message: inputText,
              sender: "user",
              id: crypto.randomUUID(),
            },
            {
              message: response,
              sender: "robot",
              id: crypto.randomUUID(),
            },
          ]);

          setInputText("");
        }

        return (
          <div className="chat-input">
            <input
              type="text"
              placeholder="Send a message to ChatBot"
              size="30"
              onChange={saveInputText}
              value={inputText}
            />
            <button className="send-button" onClick={sendMessage}>
              Send
            </button>
          </div>
        );
      }

      function ChatMessage(props) {
        return (
          <div className={props.sender === "user" ? "user-chat" : "robot-chat"}>
            {props.sender === "robot" && <img src="robot.png" width="50" />}
            <div className="message-box">{props.message}</div>
            {props.sender === "user" && <img src="user.png" width="50" />}
          </div>
        );
      }

      function App() {
        const array = React.useState([]);

        const chatMessages = array[0];
        const setChatMessages = array[1];

        const chatMessagesRef = React.useRef(null);

        React.useEffect(() => {
          const containerElem = chatMessagesRef.current;
          if (containerElem) {
            containerElem.scrollTop = containerElem.scrollHeight;
          }
        }, [chatMessages]);

        return (
          <div className="app-container">
            <div className="messages-container" ref={chatMessagesRef}>
              {chatMessages.map((item) => {
                return (
                  <ChatMessage
                    message={item.message}
                    sender={item.sender}
                    key={item.id}
                  />
                );
              })}
            </div>
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
          </div>
        );
      }
      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
